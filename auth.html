<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth — E-CURE.EARTH</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            chocolate: { 950: '#190F0B', 900: '#241711', 800: '#2E1E16', 700: '#3A251B', 600: '#543A2D' },
            parchment: { 50: '#FAF7F2', 100: '#F4EFE8', 200: '#EDE5DA', 300: '#E2D7C7', 400: '#DCD3C6', 500: '#B8AB99' },
            burnt: { 400: '#DC6B3A', 500: '#C85524', 600: '#A64217' }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #241711; }
    ::-webkit-scrollbar-thumb { background: #3A251B; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #543A2D; }

    /* Glassmorphic card */
    .glass-card {
      background: rgba(46, 30, 22, 0.75);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    /* Input autofill override */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #F4EFE8;
      -webkit-box-shadow: 0 0 0 40px #190F0B inset;
      caret-color: #F4EFE8;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* Strength meter transition */
    .strength-bar {
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
    }

    /* Toast slide-in */
    @keyframes toastIn {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(120%); opacity: 0; }
    }
    .toast-enter { animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .toast-exit  { animation: toastOut 0.35s cubic-bezier(0.55, 0, 1, 0.45) forwards; }

    /* Radial background accents */
    .bg-radial-accents {
      background:
        radial-gradient(ellipse 600px 500px at 15% 20%, rgba(200, 85, 36, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 85% 75%, rgba(200, 85, 36, 0.05) 0%, transparent 70%),
        radial-gradient(ellipse 800px 600px at 50% 50%, rgba(46, 30, 22, 0.5) 0%, transparent 80%),
        linear-gradient(165deg, #241711 0%, #190F0B 50%, #241711 100%);
    }

    /* Subtle float animation for decoration */
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(12px, -18px) scale(1.05); }
    }
    .orb-float { animation: floatOrb 12s ease-in-out infinite; }
    .orb-float-delayed { animation: floatOrb 15s ease-in-out 3s infinite; }

    /* Focus ring */
    .input-focus:focus {
      border-color: #C85524;
      box-shadow: 0 0 0 3px rgba(200, 85, 36, 0.15);
      outline: none;
    }

    /* Error state */
    .input-error {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12) !important;
    }

    /* Tab pill slider */
    .tab-slider {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>

  <script>
  (function () {
    'use strict';

    /* ─── Constants ─── */
    const USERS_KEY   = 'ecure_users';
    const SESSION_KEY = 'ecure_session';
    const EMAIL_RE    = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const DEMO_USER   = {
      name: 'Demo Organisation',
      email: 'demo@ecure.earth',
      password: 'demo123',
      role: 'admin'
    };

    /* ─── Seed demo user ─── */
    function seedUsers() {
      let users = getUsers();
      if (!users.find(u => u.email === DEMO_USER.email)) {
        users.push(DEMO_USER);
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }
    }

    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
      catch { return []; }
    }

    /* ─── Session helpers ─── */
    function getSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
      catch { return null; }
    }

    function setSession(user) {
      const session = {
        name: user.name,
        email: user.email,
        role: user.role || 'admin',
        loggedIn: true,
        ts: Date.now()
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    }

    /* ─── Redirect if already logged in ─── */
    function checkExistingSession() {
      const s = getSession();
      if (s && s.loggedIn) {
        window.location.href = 'dashboard.html';
      }
    }

    /* ─── Toast system ─── */
    function showToast(message, type) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      const colorMap = {
        success: { border: 'border-green-500/60', icon: '✓', text: 'text-green-400' },
        error:   { border: 'border-red-500/60',   icon: '✕', text: 'text-red-400'   },
        info:    { border: 'border-burnt-500/60',  icon: 'ℹ', text: 'text-burnt-400' }
      };
      const c = colorMap[type] || colorMap.info;

      toast.className = `toast-enter pointer-events-auto flex items-start gap-3 bg-chocolate-900/95 backdrop-blur-md border ${c.border} rounded-xl px-5 py-4 shadow-2xl shadow-black/40 max-w-xs`;
      toast.innerHTML = `
        <span class="${c.text} text-base font-bold mt-0.5 shrink-0">${c.icon}</span>
        <span class="text-sm text-parchment-200 font-sans leading-relaxed">${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        toast.addEventListener('animationend', () => toast.remove());
      }, 3500);
    }

    /* ─── Tab switching ─── */
    window.switchTab = function (tab) {
      const slider     = document.getElementById('tabSlider');
      const signInForm = document.getElementById('signinForm');
      const regForm    = document.getElementById('registerForm');
      const tabSI      = document.getElementById('tabSignIn');
      const tabReg     = document.getElementById('tabRegister');

      clearAllErrors();

      if (tab === 'register') {
        slider.style.transform = 'translateX(100%)';
        signInForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabSI.classList.remove('text-parchment-100');
        tabSI.classList.add('text-parchment-500');
        tabReg.classList.remove('text-parchment-500');
        tabReg.classList.add('text-parchment-100');
      } else {
        slider.style.transform = 'translateX(0)';
        regForm.classList.add('hidden');
        signInForm.classList.remove('hidden');
        tabReg.classList.remove('text-parchment-100');
        tabReg.classList.add('text-parchment-500');
        tabSI.classList.remove('text-parchment-500');
        tabSI.classList.add('text-parchment-100');
      }
    };

    /* ─── Password visibility toggle ─── */
    window.toggleVis = function (inputId, btn) {
      const inp = document.getElementById(inputId);
      const eyeOpen   = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      if (inp.type === 'password') {
        inp.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      } else {
        inp.type = 'password';
        eyeClosed.classList.add('hidden');
        eyeOpen.classList.remove('hidden');
      }
    };

    /* ─── Password strength meter ─── */
    window.updateStrength = function (val) {
      const bar   = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');

      if (!val) {
        bar.style.width = '0';
        label.textContent = '—';
        label.className = 'text-[10px] font-mono tracking-wider uppercase text-parchment-500 min-w-[52px] text-right';
        return;
      }

      let score = 0;
      if (val.length >= 6)                score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/\d/.test(val))                 score++;
      if (/[^A-Za-z0-9]/.test(val))       score++;

      const levels = [
        { w: '25%', color: 'bg-red-500',    label: 'Weak',     textCls: 'text-red-400'    },
        { w: '50%', color: 'bg-orange-500',  label: 'Fair',     textCls: 'text-orange-400'  },
        { w: '75%', color: 'bg-yellow-500',  label: 'Good',     textCls: 'text-yellow-400'  },
        { w: '100%',color: 'bg-green-500',   label: 'Strong',   textCls: 'text-green-400'   }
      ];

      const lvl = levels[Math.max(0, score - 1)] || levels[0];
      bar.style.width = lvl.w;
      bar.className = `strength-bar h-full rounded-full ${lvl.color}`;
      label.textContent = lvl.label;
      label.className = `text-[10px] font-mono tracking-wider uppercase ${lvl.textCls} min-w-[52px] text-right`;
    };

    /* ─── Validation helpers ─── */
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('hidden');
      // Also add error border to the sibling input
      const input = el.parentElement.querySelector('input');
      if (input) input.classList.add('input-error');
    }

    function clearError(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.classList.add('hidden');
      const input = el.parentElement.querySelector('input');
      if (input) input.classList.remove('input-error');
    }

    function clearAllErrors() {
      ['siEmailErr','siPasswordErr','regOrgErr','regEmailErr','regPasswordErr','regConfirmErr'].forEach(clearError);
    }

    /* ─── Sign In handler ─── */
    document.getElementById('signinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearAllErrors();

      const email = document.getElementById('siEmail').value.trim();
      const pass  = document.getElementById('siPassword').value;
      let valid = true;

      if (!email) {
        showError('siEmailErr', 'Email is required.');
        valid = false;
      } else if (!EMAIL_RE.test(email)) {
        showError('siEmailErr', 'Enter a valid email address.');
        valid = false;
      }

      if (!pass) {
        showError('siPasswordErr', 'Password is required.');
        valid = false;
      } else if (pass.length < 4) {
        showError('siPasswordErr', 'Password must be at least 4 characters.');
        valid = false;
      }

      if (!valid) return;

      const users = getUsers();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());

      if (!user) {
        showError('siEmailErr', 'No account found with this email.');
        showToast('Account not found. Check your email.', 'error');
        return;
      }

      if (user.password !== pass) {
        showError('siPasswordErr', 'Incorrect password.');
        showToast('Invalid credentials. Please try again.', 'error');
        return;
      }

      setSession(user);
      showToast('Welcome back, ' + (user.name || user.email) + '!', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
    });

    /* ─── Register handler ─── */
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearAllErrors();

      const org     = document.getElementById('regOrg').value.trim();
      const email   = document.getElementById('regEmail').value.trim();
      const pass    = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      let valid = true;

      if (!org) {
        showError('regOrgErr', 'Organisation name is required.');
        valid = false;
      }

      if (!email) {
        showError('regEmailErr', 'Email is required.');
        valid = false;
      } else if (!EMAIL_RE.test(email)) {
        showError('regEmailErr', 'Enter a valid email address.');
        valid = false;
      }

      if (!pass) {
        showError('regPasswordErr', 'Password is required.');
        valid = false;
      } else if (pass.length < 6) {
        showError('regPasswordErr', 'Password must be at least 6 characters.');
        valid = false;
      }

      if (!confirm) {
        showError('regConfirmErr', 'Please confirm your password.');
        valid = false;
      } else if (pass !== confirm) {
        showError('regConfirmErr', 'Passwords do not match.');
        valid = false;
      }

      if (!valid) return;

      const users = getUsers();
      if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
        showError('regEmailErr', 'This email is already registered.');
        showToast('Account already exists. Try signing in.', 'error');
        return;
      }

      const newUser = { name: org, email: email, password: pass, role: 'admin' };
      users.push(newUser);
      localStorage.setItem(USERS_KEY, JSON.stringify(users));

      setSession(newUser);
      showToast('Organisation registered successfully!', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
    });

    /* ─── Instant Demo button ─── */
    document.getElementById('demoBtnLogin').addEventListener('click', function () {
      switchTab('signin');
      document.getElementById('siEmail').value = DEMO_USER.email;
      document.getElementById('siPassword').value = DEMO_USER.password;
      clearAllErrors();

      const user = getUsers().find(u => u.email === DEMO_USER.email);
      if (user) {
        setSession(user);
        showToast('Launching demo environment…', 'info');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
      }
    });

    /* ─── Live input clearing of errors on type ─── */
    ['siEmail','siPassword','regOrg','regEmail','regPassword','regConfirm'].forEach(id => {
      const input = document.getElementById(id);
      if (input) {
        input.addEventListener('input', () => {
          const errId = id + 'Err';
          if (document.getElementById(errId)) clearError(errId);
        });
      }
    });

    /* ─── URL param ?signup=true ─── */
    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('signup') === 'true') {
        switchTab('register');
      }
    }

    /* ─── Init ─── */
    seedUsers();
    checkExistingSession();
    checkUrlParams();

  })();
  </script>

</body>
